[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inpockets-backend"
version = "0.1.0"
description = "Backend API for the InPockets digital lending platform."
requires-python = ">=3.14,<3.15"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "psycopg[binary]",
    "alembic",
    "redis",
    "httpx",
    "python-multipart>=0.0.20",
    "reportlab>=4.2,<5",
    "boto3",
    "cryptography>=44",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pypdf",
    "moto[s3]",
    "ruff",
    "pip-audit",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.mypy]
python_version = "3.14"
strict = true

[tool.setuptools.packages.find]
include = ["app*"]
