services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    command: python -m pytest -q
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inpockets_test
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: test-only-secret
      OTP_HASH_SECRET: test-only-otp-secret
      SMS_PROVIDER: development
      PAN_PROVIDER: development
      KYC_PROVIDER: development
      DOCUMENT_STORAGE_PROVIDER: development
      IDENTITY_VERIFICATION_PROVIDER: development
      DISBURSEMENT_PROVIDER: development
      PAYMENT_PROVIDER: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inpockets-api
    restart: unless-stopped
    # Mount local source code into the container
    volumes:
      - ./app:/app/app

    # Automatically reload when Python files change
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inpockets
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-change-me-otp-secret}
      SMS_PROVIDER: ${SMS_PROVIDER:-development}
      PAN_PROVIDER: ${PAN_PROVIDER:-development}
      KYC_PROVIDER: ${KYC_PROVIDER:-development}
      DOCUMENT_STORAGE_PROVIDER: ${DOCUMENT_STORAGE_PROVIDER:-development}
      DOCUMENT_STORAGE_PATH: ${DOCUMENT_STORAGE_PATH:-.data/documents}
      IDENTITY_VERIFICATION_PROVIDER: ${IDENTITY_VERIFICATION_PROVIDER:-development}
      DISBURSEMENT_PROVIDER: ${DISBURSEMENT_PROVIDER:-development}
      DISBURSEMENT_WEBHOOK_SECRET: ${DISBURSEMENT_WEBHOOK_SECRET:-}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
      FIELD_ENCRYPTION_ACTIVE_KEY_ID: ${FIELD_ENCRYPTION_ACTIVE_KEY_ID:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-development}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      LEDGER_INTEREST_FEE_POSTING_ENABLED: ${LEDGER_INTEREST_FEE_POSTING_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      
  disbursement-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inpockets-disbursement-worker
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    command: python -m app.workers.disbursement --interval 15
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inpockets
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-change-me-otp-secret}
      DISBURSEMENT_PROVIDER: ${DISBURSEMENT_PROVIDER:-development}
      DISBURSEMENT_WEBHOOK_SECRET: ${DISBURSEMENT_WEBHOOK_SECRET:-}
      FIELD_ENCRYPTION_KEYS: ${FIELD_ENCRYPTION_KEYS:-}
      FIELD_ENCRYPTION_ACTIVE_KEY_ID: ${FIELD_ENCRYPTION_ACTIVE_KEY_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  repayment-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inpockets-repayment-worker
    restart: unless-stopped
    volumes:
      - ./app:/app/app
    command: python -m app.workers.repayment --interval 15
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/inpockets
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me}
      OTP_HASH_SECRET: ${OTP_HASH_SECRET:-change-me-otp-secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-development}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-}
      LEDGER_INTEREST_FEE_POSTING_ENABLED: ${LEDGER_INTEREST_FEE_POSTING_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: inpockets-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: inpockets
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inpockets"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: inpockets-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
